name: Release to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content band/src/manifest.json -Raw | ConvertFrom-Json).versionName
          $tag = "v$version"
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne $tag) { throw 'Release tag does not match manifest version.' }
          $dir = "artifacts/$tag"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Release asset download failed.' }
          Push-Location $dir
          try {
            foreach ($line in Get-Content SHA256SUMS.txt) {
              if ($line -notmatch '^([a-fA-F0-9]{64})\s+(\S+)$') { throw 'Invalid checksum line.' }
              if ((Get-FileHash -LiteralPath $Matches[2] -Algorithm SHA256).Hash -ne $Matches[1]) { throw 'Release asset checksum mismatch.' }
            }
          } finally { Pop-Location }
          ./scripts/publish-cf-pages.ps1
      - name: Deploy to Cloudflare Pages
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy artifacts/cf-pages --project-name=geely-band-control --branch=main --force
