plugins { id 'com.android.application' }
apply from: rootProject.file('pair-signing.gradle')

android {
    namespace 'com.mario.lynkband.watch'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.mario.lynkband.watch'
        minSdk 28
        targetSdk 35
        versionCode 46
        versionName '0.3.42'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main.java.srcDir '../shared/src/main/java'
        main.res.srcDir '../app/src/main/res'
        main.res.srcDir '../shared/src/main/res'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
