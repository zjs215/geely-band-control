import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'com.android.application' version '8.13.2'
}

def fullRpk = 'wrist-car-control.rpk'
def liteRpk = 'wrist-car-control-lite.rpk'
def watchApk = 'wrist-car-control-watch.apk'
def phoneApk = 'pocket-car-control.apk'
def productPackage = 'com.garage.bandcontrol'
def bandManifest = new JsonSlurper().parse(file('../../band/src/manifest.json'))
def packageDir = providers.gradleProperty('wearablePackageDir').map { file(it) }
    .getOrElse(file("../../artifacts/v${bandManifest.versionName}"))
def assetsDir = layout.buildDirectory.dir('generated/assets/wearable')

android {
    namespace 'com.otrong.carcontrol.installer'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.garage.bandcontrol.installer'
        minSdk 28
        targetSdk 35
        versionCode 51
        versionName '0.3.1'
    }

    sourceSets.main.assets.srcDir assetsDir
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
            excludes += ['META-INF/versions/**']
        }
    }
}

def prepareWearableAssets = tasks.register('prepareWearableAssets') {
    def checksumsFile = new File(packageDir, 'SHA256SUMS.txt')
    def rpkFile = new File(packageDir, fullRpk)
    def liteFile = new File(packageDir, liteRpk)
    def watchFile = new File(packageDir, watchApk)
    def phoneFile = new File(packageDir, phoneApk)
    inputs.files(checksumsFile, rpkFile, liteFile, watchFile, phoneFile)
    outputs.dir(assetsDir)
    doLast {
        def checksums = [:]
        checksumsFile.eachLine('UTF-8') { line ->
            def entry = line.trim() =~ /^([a-fA-F0-9]{64})\s+(\S+)$/
            if (entry.matches()) checksums[entry.group(2)] = entry.group(1).toLowerCase(Locale.ROOT)
        }

        def sealedDir = assetsDir.get().dir('wearable').asFile
        sealedDir.mkdirs()
        def retained = [fullRpk, liteRpk, watchApk, phoneApk, 'packages.properties']
        sealedDir.listFiles()?.findAll { it.isFile() && !retained.contains(it.name) }?.each { obsolete ->
            if (!obsolete.delete()) throw new GradleException('Cannot remove obsolete generated asset ' + obsolete.name)
        }
        def metadata = new Properties()
        [band: rpkFile, lite: liteFile, watch: watchFile, phone: phoneFile].each { target, source ->
            byte[] data = source.bytes
            String digest = MessageDigest.getInstance('SHA-256').digest(data).encodeHex().toString()
            if (data.length == 0 || digest != checksums[source.name]) {
                throw new GradleException('Check ' + source.name + ' against SHA256SUMS.txt in ' + packageDir)
            }
            new File(sealedDir, source.name).bytes = data
            metadata.setProperty(target + '.name', source.name)
            metadata.setProperty(target + '.size', Integer.toString(data.length))
            metadata.setProperty(target + '.sha256', digest)
        }

        def readRpkManifest = { String name, boolean full ->
            new ZipFile(new File(sealedDir, name)).withCloseable { zip ->
                def entry = zip.getEntry('manifest.json')
                boolean hasThemes = zip.entries().any { it.name.startsWith('common/themes/') && it.name.endsWith('.jpg') }
                if (entry == null || !zip.getEntry('META-INF/CERT')?.size || hasThemes != full) {
                    throw new GradleException('Incorrect RPK variant or missing signature in ' + name)
                }
                def manifest = zip.getInputStream(entry).withCloseable { stream -> new JsonSlurper().parse(stream) }
                if (manifest.package != productPackage || !manifest.deviceTypeList?.contains('watch') ||
                        !manifest.versionName || !(manifest.versionCode instanceof Number) || manifest.versionCode <= 0) {
                    throw new GradleException('Incorrect wrist app manifest in ' + name)
                }
                return manifest
            }
        }
        def manifest = readRpkManifest(fullRpk, true)
        def lite = readRpkManifest(liteRpk, false)
        if (lite.versionCode != manifest.versionCode || lite.versionName != manifest.versionName) {
            throw new GradleException('Full and Lite RPK versions must match')
        }

        def suffix = System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''
        def versionDir = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion)
        def aapt = new File(versionDir, 'aapt' + suffix)
        def stagedWatch = new File(sealedDir, watchApk)
        def badging = providers.exec {
            commandLine aapt, 'dump', 'badging', stagedWatch
        }.standardOutput.asText.get()
        def details = badging =~ /(?m)^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'/
        def watchManifest = providers.exec {
            commandLine aapt, 'dump', 'xmltree', stagedWatch, 'AndroidManifest.xml'
        }.standardOutput.asText.get()
        if (!details.find() || details.group(1) != productPackage ||
                !watchManifest.contains('android.hardware.type.watch') ||
                !watchManifest.contains('com.otrong.carcontrol.watch.WatchActivity') ||
                details.group(2) != manifest.versionCode.toString() || details.group(3) != manifest.versionName) {
            throw new GradleException('wrist-car-control-watch.apk must be the wrist app APK')
        }
        def phoneBadging = providers.exec {
            commandLine aapt, 'dump', 'badging', new File(sealedDir, phoneApk)
        }.standardOutput.asText.get()
        def phoneDetails = phoneBadging =~ /(?m)^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'/
        def phoneManifest = providers.exec {
            commandLine aapt, 'dump', 'xmltree', new File(sealedDir, phoneApk), 'AndroidManifest.xml'
        }.standardOutput.asText.get()
        if (!phoneDetails.find() || phoneDetails.group(1) != productPackage ||
                !phoneManifest.contains('com.otrong.carcontrol.phone.MainActivity') ||
                phoneManifest.contains('android.hardware.type.watch') ||
                phoneDetails.group(2) != manifest.versionCode.toString() || phoneDetails.group(3) != manifest.versionName) {
            throw new GradleException('pocket-car-control.apk must be the phone app APK')
        }
        metadata.setProperty('phone.version', phoneDetails.group(3))
        metadata.setProperty('phone.versionCode', phoneDetails.group(2))
        metadata.setProperty('band.version', manifest.versionName.toString())
        metadata.setProperty('band.versionCode', manifest.versionCode.toString())
        metadata.setProperty('lite.version', lite.versionName.toString())
        metadata.setProperty('lite.versionCode', lite.versionCode.toString())
        metadata.setProperty('watch.version', details.group(3))
        metadata.setProperty('watch.versionCode', details.group(2))
        new File(sealedDir, 'packages.properties').withOutputStream { metadata.store(it, null) }
    }
}

tasks.named('preBuild') {
    dependsOn prepareWearableAssets
}

dependencies {
    implementation 'com.github.osservatorionessuno:libadb-android-bc:3.5.1'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.84'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
