plugins {
    id 'com.android.application'
}

def workspace = rootProject.projectDir.parentFile
def signing = new Properties()
def signingFile = new File(workspace, '.local/signing.properties')
if (!signingFile.isFile()) {
    throw new GradleException('Run scripts/prepare.ps1 to create the matching Android and Vela signing files.')
}
signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.otrong.carcontrol.phone'
    compileSdk 36

    defaultConfig {
        applicationId 'com.garage.bandcontrol'
        minSdk 28
        targetSdk 35
        versionCode 52
        versionName '0.3.2'
        testInstrumentationRunner 'com.otrong.carcontrol.phone.LynkCardInstrumentation'
    }

    signingConfigs {
        localPair {
            storeFile new File(workspace, '.local/companion.p12')
            storeType 'PKCS12'
            storePassword signing.getProperty('password')
            keyAlias 'bandcontrol'
            keyPassword signing.getProperty('password')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.localPair
        }
    }
    buildFeatures {
        buildConfig = true
    }
    sourceSets {
        main.java.srcDir '../shared/src/main/java'
        main.assets.srcDir '../shared/src/main/assets'
        debug.res.srcDir new File(workspace, '.local/android-res')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files(new File(workspace, '.local/xms-wearable-lib_1.4_release.aar'))
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
